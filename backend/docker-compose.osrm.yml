# =============================================================================
# Sameway — OSRM self-hosted routing engine (standalone)
# =============================================================================
#
# Quick start
# ───────────
#   1. One-time data prep (~15 min):
#        bash docker/osrm-setup.sh
#
#   2. Start OSRM:
#        docker compose -f docker-compose.osrm.yml up -d
#
#   3. Test:
#        curl "http://localhost:5000/nearest/v1/driving/90.4125,23.8103"
#
#   4. Add to backend/.env (pick the line that matches how you run the API):
#        OSRM_URL=http://localhost:5000              # npm run dev on host
#        OSRM_URL=http://host.docker.internal:5000   # API in Docker (WSL/Windows)
#
# To stop:  docker compose -f docker-compose.osrm.yml down
# Refresh:  docker compose -f docker-compose.osrm.yml down
#           docker volume rm sameway_osrm_data
#           bash docker/osrm-setup.sh
# =============================================================================

name: sameway-osrm

services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    restart: unless-stopped
    volumes:
      - osrm_data:/data
    command:
      - "osrm-routed"
      - "--algorithm"
      - "mld"
      - "--max-table-size"
      - "2000"
      - "--max-trip-size"
      - "200"
      - "/data/bangladesh-latest.osrm"
    ports:
      - "5000:5000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:5000/nearest/v1/driving/90.4125,23.8103' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  # Same fixed name used by docker/osrm-setup.sh — run the setup script first.
  osrm_data:
    name: sameway_osrm_data
