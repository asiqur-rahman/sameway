# OSRM is included in the main stack — use:
#   docker compose up -d
#
# This file is kept for OSRM-only runs (same one-command flow):
#   docker compose -f docker-compose.osrm.yml up -d

name: sameway-osrm

x-osrm-image: &osrm-image ghcr.io/project-osrm/osrm-backend:latest

services:
  osrm-setup:
    build:
      context: .
      dockerfile: docker/Dockerfile.osrm-setup
    environment:
      OSRM_EXTRACT_THREADS: "2"
    volumes:
      - osrm_data:/data
    restart: "no"

  osrm:
    image: *osrm-image
    restart: unless-stopped
    volumes:
      - osrm_data:/data
    command:
      - "osrm-routed"
      - "--algorithm"
      - "mld"
      - "--max-table-size"
      - "2000"
      - "--max-trip-size"
      - "200"
      - "/data/bangladesh-latest.osrm"
    ports:
      - "5000:5000"
    depends_on:
      osrm-setup:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- 'http://127.0.0.1:5000/nearest/v1/driving/90.4125,23.8103' || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  osrm_data:
    name: sameway_osrm_data
